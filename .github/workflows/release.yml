# Build runnable installers for every desktop platform and publish them to the
# GitHub release.
#
# Why this lives in CI: electron-builder can only produce a macOS `.dmg` on
# macOS and a Linux `.AppImage` on Linux, so no single workstation can build the
# whole matrix.
#
# Where the source comes from
#   Gitee is the source of truth for this project (a Gitee Go pipeline mirrors it
#   to GitHub, and that mirror has been flaky). To stay independent of the mirror
#   the build job fetches the tag straight from the Gitee repository, which needs
#   no credentials because that repository is public.
#
# Triggers
#   - pushing a tag starting with `v` (on GitHub, whenever the mirror worked)
#   - a scheduled sweep (every 6 hours) that looks for Gitee tags which have no
#     GitHub release yet — this is what makes "just tag on Gitee" enough
#   - manual run (workflow_dispatch) against any existing tag
#
# Gitee release attachments are NOT uploaded from here: a GitHub-hosted runner
# cannot push ~95 MB attachments to Gitee (measured: 18 minutes, zero bytes
# landed). Run `pnpm release:gitee <tag>` on a machine inside China instead —
# that path uploads the same files at ~4 MiB/s.
name: release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的标签名（例如 v0.1.0-beta）'
        required: true
        default: 'v0.1.0-beta'
      prerelease:
        description: '标记为预发行版'
        type: boolean
        default: true

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.0'
  GITEE_OWNER: xusy545
  GITEE_REPO: robrowser
  GITHUB_REPO: Mio545/robrowser

jobs:
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: Pick the tag to build
        id: pick
        env:
          # Needed only to ask GitHub whether a release already exists.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            # Scheduled sweep: newest Gitee tags first, build the first one that
            # has no GitHub release yet.
            echo "Gitee 上的标签（新→旧）："
            git ls-remote --tags "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" \
              | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}$' | sort -rV | head -10 > /tmp/tags
            cat /tmp/tags
            tag=""
            while read -r candidate; do
              [ -z "$candidate" ] && continue
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${candidate}")
              if [ "$code" = "404" ]; then tag="$candidate"; break; fi
              echo "  ${candidate} 已有 GitHub 发行版，跳过"
            done < /tmp/tags
            if [ -z "$tag" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "没有待构建的标签"
              exit 0
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "本次构建标签：${tag}"

  build:
    name: ${{ matrix.label }}
    needs: resolve
    if: ${{ needs.resolve.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    # Intel macOS images may not be available on every plan; let that single
    # cell fail without sinking the release. Everything else must succeed.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, ebArgs: '--win --x64' }
          - { os: ubuntu-latest, label: linux-x64, ebArgs: '--linux --x64' }
          - { os: macos-latest, label: macos-arm64, ebArgs: '--mac --arm64' }
          - { os: macos-15-intel, label: macos-x64, ebArgs: '--mac --x64', experimental: true }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gitee is the source of truth; the GitHub copy can lag when the mirror
      # pipeline is unhappy, so pull the tag from Gitee when it is not local.
      - name: Check out the tag from Gitee
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "GitHub 上已有标签 ${TAG}"
          else
            echo "GitHub 上没有 ${TAG}，改从 Gitee 获取"
            git remote add gitee "https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git" || true
            git fetch --no-tags gitee "+refs/tags/${TAG}:refs/tags/${TAG}"
          fi
          git checkout --force "refs/tags/${TAG}"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Runs each package's postinstall, which is what downloads electron and
      # the better-sqlite3 prebuild matching the bundled Electron ABI.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Package installer
        working-directory: packages/desktop
        env:
          # No signing certificate in CI — never make electron-builder look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >
          pnpm exec electron-builder
          --config electron-builder.yml
          ${{ matrix.ebArgs }}
          --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.label }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage

  publish:
    name: publish to GitHub
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Show what will be published
        run: ls -la installers

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: installers/*
          fail_on_unmatched_files: true
          # Re-running for a tag that already has assets (e.g. after trimming the
          # installers) must replace them, not fail with HTTP 422.
          overwrite_files: true
          # `v0.1.0-beta` -> prerelease; a plain `v1.0.0` stays a full release.
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(needs.resolve.outputs.tag, '-') }}

      - name: How to publish the same files to Gitee
        run: |
          cat <<'EOF'
          安装包已挂到 GitHub 发行版。Gitee 侧的附件请在国内机器上执行：

              pnpm release:gitee ${{ needs.resolve.outputs.tag }}

          （GitHub runner 向 Gitee 上传约 95MB 的附件实测不可用，故此处不再尝试。）
          EOF
