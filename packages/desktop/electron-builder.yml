# electron-builder configuration (spec 2 / 10).
#
# The renderer is bundled by Vite into dist/renderer; tsc emits the main and
# preload bundles into dist/main and dist/preload. Only runtime `dependencies`
# are installed into the app, which is why React/Vite/TypeScript live in
# devDependencies while better-sqlite3/pino/zod @robrowser/* are real deps.
appId: com.robrowser.desktop
productName: RoboBrowser
copyright: Copyright © 2024 RoboBrowser

# Electron ships ~55 locale packs (38 MB uncompressed). The app's own UI text is
# bundled in the renderer, so only Chromium's built-in strings depend on these.
# Keeping zh-CN + en-US keeps the installers well under Gitee's 100 MB per
# attachment limit (the Linux AppImage used to sit at 104.8 MB and was rejected).
electronLanguages:
  - zh-CN
  - en-US

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Native module: the desktop package's own `postinstall`
# (scripts/rebuild-native.mjs) already downloads better-sqlite3's Electron-ABI
# prebuild, so electron-builder must NOT try to rebuild it again. With pnpm's
# strict node_modules layout the rebuild step cannot find `prebuild-install`
# inside the package, falls back to executing pnpm.cjs directly and dies with
# "%1 is not a valid Win32 application" on Windows (`cannot execute` on other
# platforms), failing the whole package step.
npmRebuild: false
asarUnpack:
  - '**/*.node'

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development

extraMetadata:
  main: dist/main/index.js
