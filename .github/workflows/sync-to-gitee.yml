name: Sync to Gitee

on:
  push:
    branches:
      - master

jobs:
  run:
    name: Sync-GitHub-to-Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the Github repos to Gitee.
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/Mio545
          dst: gitee/xusy545
          dst_key: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          account_type: user
          force_update: true
          src_token: ${{ secrets.GITHUB_TOKEN }}  # 自动获取 GitHub 官方提供的临时令牌，用于读取私有仓库
          static_list: "robrowser"                # 白名单：只同步 robrowser 这一个仓库，忽略其他